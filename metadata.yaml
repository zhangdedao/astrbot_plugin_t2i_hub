desc: 通用文生图插件，支持阿里云百炼多模型额度耗尽自动降级、自然语言触发词、副脑提示词优化 # 插件简短描述
help: 支持阿里百炼（wan2.x-image / qwen-image 系列，多模型额度耗尽自动降级）、智谱AI、百度千帆、PPIO、火山引擎（豆包）、科大讯飞等服务商。使用方法：/tti <描述文字> 自动选择供应商生成图片，或使用 /tti-tongyi、/tti-zhipu、/tti-qianfan、/tti-ppio、/tti-huoshan、/tti-xunfei 指定供应商；支持 --model xxx 强制指定模型；可开启自然语言触发词直接绘图；可开启副脑自动优化提示词；支持 Agent function-call 调用绘图。 # 插件的帮助信息
